name: Run DataGen

on:
  workflow_dispatch:

jobs:
  datagen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run DataGen
        run: ./gradlew runData --stacktrace 2>&1 | tee /tmp/gradle-log.txt
      
      - name: Show tasks and errors
        if: always()
        run: |
          echo "=== ORDINE DEI TASK ==="
          grep -E "^> Task :" /tmp/gradle-log.txt || echo "Nessun task trovato"
          echo ""
          echo "=== ERRORI ==="
          grep -A 10 -E "Caused by:|Exception|FAILED" /tmp/gradle-log.txt | head -50 || echo "Nessun errore trovato"

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate data files"
